name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
      - name: Install from uv.lock
        run: uv sync --locked --extra dev --python 3.12
      # Skipped: tests that need live Power BI credentials, and the Playwright browser tests.
      - name: Tests
        run: >-
          uv run --no-sync pytest -q -W ignore::SyntaxWarning
          --ignore=tests/test_api_integration.py
          --ignore=tests/test_e2e.py
          --ignore=tests/test_startup_validation.py
          --ignore=tests/test_e2e_rendering.py
