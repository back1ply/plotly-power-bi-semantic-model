[project]
name = "plotly-power-bi-semantic-model"
version = "0.1.0"
description = "Power BI Sales Dashboard with Plotly and Dash"
requires-python = ">=3.12"
dependencies = [
    "dash>=4.1.0",
    "dash-mantine-components>=2.6.1",
    "dash-iconify>=0.1.2",
    "dash-ag-grid>=33.3.3",
    "pandas>=2.3.3",
    "diskcache>=5.6.3",
    "plotly>=6.6.0",
    "msal>=1.35.1",
    "requests>=2.33.1",
    "python-dotenv>=1.2.2",
    "gunicorn>=23.0.0",
    "dash-cytoscape>=1.0.1",
    "dash-ace>=0.0.5",
    "polars>=1.40.1",
    "pyarrow>=24.0.0",
]

[tool.setuptools]
packages = ["application", "components", "domain", "infrastructure", "pages", "presentation"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.15.0",
    "black>=26.0.0",
    "mypy>=1.20.0",
    "coverage>=7.0.0",
    "interrogate>=1.5.0",
    "vulture>=2.0.0",
    "bandit>=1.8.0",
    "safety>=1.10.0",
    "tryceratops>=2.0.0",
    "flake8>=7.0.0",
    "pip-audit>=1.0.0",
    "deptry>=0.20.0",
    "flake8-i18n>=0.1.0",
    "pytest-benchmark>=4.0.0",
    "hypothesis>=6.92.0",
    "pandera>=0.18.0",
    "vcrpy>=6.0.1",
    "schemathesis>=3.24.0",
    "mutmut>=2.4.4",
    "pytest-archon>=0.0.6",
    "yamllint>=1.33.0",
    "detect-secrets>=1.4.0",
    "typos>=1.16.25",
    "pre-commit>=3.5.0",
    "pytest-playwright>=0.4.0",
    "axe-playwright-python>=0.1.3",
    "locust>=2.24.0",
    "xenon>=0.9.1",
]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
    ".claude",
    ".planning",
    ".cache",
    ".venv",
    "venv",
    "logs",
    "tests",
    "__pycache__",
]

[tool.ruff.lint]
select = [
    "F",    # Pyflakes
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "I",    # isort - import sorting
    "N",    # Naming conventions
    "UP",   # pyupgrade - modern Python syntax
    "C4",   # Comprehensions
    "RUF",  # Ruff-specific rules
    "RSE",  # Raise statements
    "RET",  # Return statements
    "SIM",  # Simplify
    "PTH",  # Path
    "PGH",  # pygrep-hooks
    "ERA",  # Eradicate
    "PL",   # Pylint
]

ignore = [
    "E501",  # line too long
    "E701",  # multiple statements on one line
    "W293",  # blank line whitespace
    "W291",  # trailing whitespace
    "N802",  # function name should be lowercase
    "N803",  # argument name should be lowercase
    "N806",  # argument name in function should be lowercase
    "N999",  # invalid module name - often false positives
    "PLR0913",  # too many arguments
    "PLR0912",  # too many branches
    "PLR2004",  # magic value comparison
    "SIM114",   # combine using dictionary
    "C901",     # too complex
    "RUF100",   # unused disable comment
    "RUF001", # ambiguous variable name
    "RUF002", # ambiguous class name
    "RUF003", # ambiguous method name
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401", "N802", "PLR2004", "I001", "PLC0415"]
"scripts/*" = ["I001", "PTH123", "RUF012"]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
force-single-line = true
order-by-type = false
known-first-party = ["components", "pages", "utils", "domain", "infrastructure", "presentation", "application"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = false
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "pandas.*", "plotly.*", "dash.*", "dash_mantine_components.*", 
    "diskcache.*", "msal.*", "yaml.*", "dotenv.*", "pbipy.*", 
    "dash_iconify.*", "dash_ag_grid.*", "requests.*"
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "presentation.charts"
warn_unused_ignores = false

[tool.pyright]
reportPrivateImportUsage = false
typeCheckingMode = "basic"
reportMissingImports = true
reportUndefinedVariable = true
reportUnusedImport = true
reportMissingModuleSource = false
pythonVersion = "3.12"
reportMissingTypeStubs = false
extraPaths = ["."]
include = ["app.py", "utils", "components", "pages", "domain", "infrastructure", "presentation", "application"]
exclude = [".claude", ".planning", ".cache", "logs", "scripts", "docs", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "archon: Architecture boundary tests",
    "e2e: End-to-end tests",
    "a11y: Accessibility tests",
]

[tool.vulture]
exclude = ["tests/"]
ignore_decorators = ["@callback", "@safe_callback", "@app.server.route", "@server.route"]
ignore_names = ["port_type", "validation_layout", "ModelData", "table_names", "SALES_BY_CATEGORY", "success", "name", "fetch_dynamic_data", "_update_active_nav", "build_category_sales_chart"]
